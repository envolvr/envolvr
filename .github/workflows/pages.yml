# Publishes site/ (envolvr.xyz: the landing page, /docs/ and /llms.txt) and the
# account app built from app/ into site/app/ (envolvr.xyz/app/) to GitHub Pages
# whenever either changes on main. The build job installs npm packages and has
# no write permissions; only the deploy job can publish.
name: pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'app/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            site
            app
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Build the account app into site/app
        working-directory: app
        run: |
          npx --yes pnpm@10.13.1 install --frozen-lockfile
          npx --yes pnpm@10.13.1 run check
          npx --yes pnpm@10.13.1 run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
