# Publishes @envolvr/sdk to npm when a tag sdk-v<version> is pushed, through
# npm trusted publishing (GitHub OIDC): no npm token is stored anywhere, and
# npm records the provenance of each version. The tag must match the version
# in sdk/package.json.
name: publish-sdk

on:
  push:
    tags: ['sdk-v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm with trusted publishing (11.5.1 or later)
        run: npm install -g npm@^11.5.1
      - name: Test, build, publish
        working-directory: sdk
        run: |
          test "sdk-v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
          npx --yes pnpm@10.13.1 install --frozen-lockfile
          npx --yes pnpm@10.13.1 test
          # Build first: npm validates bin paths before its lifecycle scripts run,
          # and would drop the envolvr command if dist/cli.js did not exist yet.
          npx --yes pnpm@10.13.1 run build
          npm publish --access public
